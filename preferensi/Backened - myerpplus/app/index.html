                   background-color: #ebf4ff; }

        <script type="text/javascript">		
			var b = true, c = false, n = 0;
			$(document).ready(function () // Call function when page is ready for load..
			{
				$( this ).focusin(function() {
					if(c)
					{
						b = true	
						window.document.getElementById("txtval").value += "a";
					}
				});
				$( this ).focusout(function() {
					if(c)
					{
						b = false	
						window.document.getElementById("txtval").value += "b";
					}
					else if(n == 2)
					{
						n = 0;
						c = true
					}
					else								
					{
						n++;
					}
				});
			});
			window.onbeforeunload = WindowCloseHanlder;
			function WindowCloseHanlder()
			{
				f_unload();
			}
			
			function setFocus()
			{				
				try{
					if(b)
					{
						b = false
						c = false
						window.document.getElementById("txtval").value += "x";
						window.document.getElementById("txtval").focus();
						var myObj = document.getElementById("MyERPPlus");
						myObj.focus()
					}
					else
					{
						window.document.getElementById("txtval").value += "c";
				    }
			    }catch(err){
					alert(err.message);
				}
			}
			function print(param)
			{
				var p = param.split("Θ");
			    window.document.getElementById("frmPrint").action = p[0]+"/report/Creator.aspx";
			    window.document.getElementById("txtval").value = p[1];
                window.document.getElementById("btnsubmit").click();
			}
			function importdata(param)
			{
				var p = param.split("Θ");
			    window.document.getElementById("frmPrint").action = p[0]+"/importdata/ImportData.aspx";
			    window.document.getElementById("txtval").value = p[1];
                window.document.getElementById("btnsubmit").click();
			}
			function f_setTitle(param)
			{
			    window.document.title = param+" | MyERP Plus";
			}
			
			function f_setIcon(param)
			{
			    window.document.getElementById("icoERP").action = param+"/img/fav.png";	
			}
			
			function f_unload()
			{
				alert("Terima kasih Anda telah menggunakan Layanan MyERP Plus")
				document.getElementById("MyERPPlus").aksesfromjs()
			}
            var swfVersionStr = "11.1.0";
            var xiSwfUrlStr = "playerProductInstall.swf";
            var flashvars = {};
            var params = {};
            params.quality = "high";
            params.bgcolor = "#ebf4ff";
            params.allowscriptaccess = "always";
            params.allowfullscreen = "true";
            var attributes = {};
            attributes.id = "MyERPPlus";
            attributes.name = "MyERPPlus";
            attributes.align = "middle";
            swfobject.embedSWF(
                "MyERPPlus.swf", "flashContent", 
                "100%", "100%", 
                swfVersionStr, xiSwfUrlStr, 
                flashvars, params, attributes);
            swfobject.createCSS("#flashContent", "display:block;text-align:left;");
        </script>
