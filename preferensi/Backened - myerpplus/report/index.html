<html>
	<head>
		<title></title>
		<link rel="icon" type="image/ico" href="../app/css/fav.png"/>
		<script language="JavaScript" type="text/javascript" >
			function load()
			{	
				if(qs("p").length == 0)
					window.location.replace(window.location.protocol+"//"+window.location.host+"/app/");
				else{
					if(qs("n").length > 0)window.document.title += " "+qs("n").split("%20").join(" ")
					window.document.getElementById("ipdf").src = window.location.protocol+"//"+window.location.host+"/report/temp/"+qs("p");
				}
			}
									
			function qs(search_for) {
				var query = window.location.search.substring(1);
				var parms = query.split('&');
				for (var i=0; i<parms.length; i++) {
					var pos = parms[i].indexOf('=');
					if (pos > 0  && search_for == parms[i].substring(0,pos)) {
						return parms[i].substring(pos+1);;
					}
				}
				return "";
			}
			</script>
	</head>
	<body style="margin:0 0 0 0;" onload="load()">
		<iframe id="ipdf" style="border: 0; width:100%; height:100%;" seamless/>
	</body>
</html>
